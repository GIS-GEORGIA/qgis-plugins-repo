name: Deploy Pages

# Serve the QGIS custom plugin repository (plugins.xml + plugins/*.zip + assets)
# as a plain static site. Uses the GitHub Actions deployment instead of the
# legacy Jekyll build, which choked on the long Unicode filenames under
# georgian_cadastre/files/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Never publish a plugin that would break on QGIS 4, and never publish a
  # plugins.xml / index.html that disagrees with the plugins' own metadata.txt.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt6 compatibility lint
        run: python tools/qt_compat_scan.py .
      - name: Plugin sources compile
        run: |
          python - <<'PY'
          import compileall, json, sys
          manifest = json.load(open("tools/plugins.json", encoding="utf-8"))
          ok = True
          for plugin in manifest["plugins"]:
              if plugin.get("source"):
                  ok &= compileall.compile_dir(plugin["source"], quiet=1, force=True)
          sys.exit(0 if ok else 1)
          PY
      - name: Generated files are up to date
        run: python tools/build.py --check
      - name: build.py survives a restrictive console encoding
        # CI's UTF-8 Linux console never catches a Windows cp1252 console
        # crashing on the Georgian/en-dash text in the summary print - this
        # forces that same class of failure here instead, where it's caught
        # before a contributor on Windows hits it locally.
        run: PYTHONIOENCODING=ascii python tools/build.py --check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

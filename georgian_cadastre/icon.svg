<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#2e7d32"/>
  <!-- parcel polygon -->
  <polygon points="14,40 20,16 44,12 52,30 40,48 22,50"
           fill="#ffffff" fill-opacity="0.15"
           stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- vertices -->
  <g fill="#ffd54f">
    <circle cx="14" cy="40" r="2.6"/>
    <circle cx="20" cy="16" r="2.6"/>
    <circle cx="44" cy="12" r="2.6"/>
    <circle cx="52" cy="30" r="2.6"/>
    <circle cx="40" cy="48" r="2.6"/>
    <circle cx="22" cy="50" r="2.6"/>
  </g>
</svg>
